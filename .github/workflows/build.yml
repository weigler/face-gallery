name: Build Face Index

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      album:
        description: "Nome do álbum"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Teto máximo permitido pelo GitHub p/ runners hospedados é 360 min (6h).
    # Deixamos uma margem de segurança.
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Instalar dependências
        run: npm install

      - name: Baixar modelos (cache entre execuções)
        uses: actions/cache@v4
        id: models-cache
        with:
          path: models
          key: face-models-v1

      - name: Baixar modelos (se não estiverem em cache)
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          wget -P models https://github.com/justadudewhohacks/face-api.js/raw/master/weights/ssd_mobilenetv1_model-weights_manifest.json
          wget -P models https://github.com/justadudewhohacks/face-api.js/raw/master/weights/ssd_mobilenetv1_model-shard1
          wget -P models https://github.com/justadudewhohacks/face-api.js/raw/master/weights/ssd_mobilenetv1_model-shard2
          wget -P models https://github.com/justadudewhohacks/face-api.js/raw/master/weights/face_landmark_68_model-weights_manifest.json
          wget -P models https://github.com/justadudewhohacks/face-api.js/raw/master/weights/face_landmark_68_model-shard1
          wget -P models https://github.com/justadudewhohacks/face-api.js/raw/master/weights/face_recognition_model-weights_manifest.json
          wget -P models https://github.com/justadudewhohacks/face-api.js/raw/master/weights/face_recognition_model-shard1
          wget -P models https://github.com/justadudewhohacks/face-api.js/raw/master/weights/face_recognition_model-shard2

      - name: Rodar script
        # continue-on-error garante que, mesmo se o script for interrompido
        # (timeout, cancelamento manual, etc.), o step de commit abaixo
        # ainda rode e salve o progresso feito até aqui.
        continue-on-error: true
        run: node index.js
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ALBUM: ${{ github.event.inputs.album }}

      - name: Commit JSON
        # if: always() garante que o commit rode mesmo se o step anterior
        # tiver falhado ou sido interrompido por timeout.
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"

          git pull origin main --rebase || echo "no pull"

          git add *.json
          git commit -m "update album: ${{ github.event.inputs.album }}" || echo "no changes"

          git push origin main
